name: Nightly benchmarks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-benchmarks

permissions:
  contents: write # push the results and gh-pages branches
  issues: write # open an issue when the run fails

jobs:
  benchmarks:
    if: github.repository == 'pgmpy/pgmpy-benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MACHINE: github-ubuntu-latest

    steps:
      - name: Checkout pgmpy-benchmarks
        uses: actions/checkout@v6

      - name: Checkout benchmark results
        uses: actions/checkout@v6
        with:
          ref: results
          path: results

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Keep the Hugging Face download directory between runs: restore the newest copy, save a new one after the run.
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ github.run_id }}
          restore-keys: huggingface-

      - name: Install benchmark tooling
        run: pip install --group asv

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `asv run NEW` exits 1 when no dev commit is newer than the newest one with results, so stop before it in that case.
      - name: Run benchmarks
        id: bench
        run: |
          head=$(git ls-remote https://github.com/pgmpy/pgmpy.git refs/heads/dev | cut -f1)
          if compgen -G "results/$MACHINE/${head:0:8}-*.json" > /dev/null; then
            echo "dev ($head) already has results; nothing to benchmark"
            exit 0
          fi
          asv machine --yes --machine "$MACHINE"
          asv run --show-stderr --machine "$MACHINE" NEW

      # Also when a benchmark errored (asv exits 2), so the dashboard shows the error.
      - name: Save the results, publish the dashboard
        if: ${{ !cancelled() && steps.bench.conclusion != 'skipped' }}
        run: |
          git -C results add -A
          git -C results diff --cached --quiet && exit 0
          git -C results commit -m "Nightly results $(date -u +%F)"
          git -C results push
          asv gh-pages --rewrite

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly benchmarks failed
          BODY: "The nightly benchmark run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
